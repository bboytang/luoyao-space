name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luoyao_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/luoyao_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: test -n "$DATABASE_URL"
      - name: Apply migrations and verify no-op rerun
        run: |
          first="$(pnpm db:migrate)"
          echo "$first"
          applied="$(printf '%s\n' "$first" | sed -nE 's/^Migrations: ([1-9][0-9]*) applied, 0 skipped$/\1/p')"
          test -n "$applied"
          second="$(pnpm db:migrate)"
          echo "$second"
          printf '%s\n' "$second" | grep -Fx "Migrations: 0 applied, $applied skipped"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
